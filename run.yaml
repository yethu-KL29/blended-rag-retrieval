setup_commands:
  - "python -m pip install -r requirements.txt"
run_commands:
  - "python src/main.py --help"
  - "python src/main.py ingest"
  - "python src/main.py query \"How are user accounts managed?\" --release rev5 --method hybrid -k 3"
  - "python src/main.py compare ac-1 --old rev4 --new rev5"
  - "python src/main.py evaluate --output artifacts/evaluation.json"
  - "python src/main.py ingest"
test_commands:
  - "python -m pytest src/tests -q"
notes: "Python 3.11-3.13 recommended in an isolated virtual environment. Bundled pinned NIST corpus; offline LSA needs no credentials, model download or GPU. Atlas and MiniLM need separate explicit setup. Benchmark labels are unvalidated source-derived seeds. Run from repository root."
